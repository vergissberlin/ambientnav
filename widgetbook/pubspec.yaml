name: ambientnav_widgetbook
description: "Widgetbook component catalogue for the AmbientNav Flutter UI."
publish_to: 'none'

# Dev tool only — intentionally NOT listed in release-please extra-files.
version: 0.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The brand layer: tokens, theming and the An* atoms.
  ambientnav_ui:
    path: ../packages/ambientnav_ui

  # The app itself, for its domain widgets, entities, providers and the
  # committed AppLocalizations delegates.
  ambientnav:
    path: ../app

  flutter_riverpod: ^3.4.2

  # PINNED EXACTLY. 3.25.0 requires flutter >=3.44.0, which the CI pin (3.44.9)
  # satisfies with zero headroom — a future 3.26 may require a newer Flutter,
  # and a catalogue that fails to build teaches people to ignore it.
  widgetbook: 3.25.0

# Mirrors app/pubspec.yaml. dependency_overrides are only honoured for the root
# package, so the app's copy does not apply once this package is the root — see
# the explanation there for why geolocator 14 and file_picker 11 cannot
# co-resolve without it.
dependency_overrides:
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
