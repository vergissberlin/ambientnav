name: ambientnav_ui
description: "AmbientNav brand layer: design tokens, theming and the brand atoms."
publish_to: 'none'
version: 0.0.1

# Deliberately has NO dependency on the ambientnav app package. Everything here
# is app-agnostic and localisation-free, so the app can depend on it without a
# cycle — app copy and domain widgets live in app/lib/ui instead.
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
